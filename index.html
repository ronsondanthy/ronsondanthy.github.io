<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONSON DANTHY</title>
    <meta name="description" content="Ronson Danthy is a full stack developer specializing in web applications, AI, machine learning, and backend development.">
    <meta name="author" content="Ronson Danthy">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ronsondanthy.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ronsondanthy.github.io/">
    <meta property="og:title" content="Ronson Danthy | Full Stack Developer">
    <meta property="og:description" content="Portfolio and professional resume of Ronson Danthy, a full stack developer specializing in AI and machine learning.">
    <meta property="og:image" content="https://ronsondanthy.github.io/images/profile.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ronson Danthy | Full Stack Developer">
    <meta name="twitter:description" content="Portfolio and professional resume of Ronson Danthy, a full stack developer specializing in AI and machine learning.">
    <meta name="twitter:image" content="https://ronsondanthy.github.io/images/profile.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap');

        :root {
            --paper: #f3f1eb;
            --ink: #1f2226;
            --muted: #59606a;
            --line: #c9c4b7;
            --accent: #2f3a4a;
            --max: 860px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Work Sans', sans-serif;
            color: var(--ink);
            line-height: 1.6;
            background:
                radial-gradient(circle at 12% 10%, #ffffff 0%, rgba(255, 255, 255, 0) 46%),
                linear-gradient(175deg, #efede6 0%, var(--paper) 32%, #ece8dd 100%);
            padding: 2.4rem 1.2rem;
        }

        .page-layout {
            width: min(100%, 1180px);
            margin: 0 auto;
            padding-left: 220px;
            position: relative;
        }

        .photo-rail {
            position: fixed;
            top: 2rem;
            display: grid;
            justify-items: center;
            gap: 0.7rem;
            padding-top: 0.5rem;
            width: 188px;
            left: max(1rem, calc((100vw - 1180px) / 2 + 1rem));
            z-index: 2;
        }

        .avatar-shell {
            width: 172px;
            height: 172px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.96);
            box-shadow: 0 16px 34px -20px rgba(25, 31, 40, 0.85);
            background: #d6d8dc;
            overflow: hidden;
            position: relative;
        }

        #profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%) saturate(85%);
            transform: scale(1);
            transition: filter 200ms linear, transform 200ms linear;
        }

        .rail-contact {
            width: 100%;
            padding: 0;
            font-size: 0.84rem;
            color: var(--muted);
        }

        .rail-contact h3 {
            margin: 0 0 0.45rem;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .rail-contact ul {
            gap: 0.16rem;
        }

        .rail-contact p,
        .rail-contact li {
            margin: 0;
            line-height: 1.45;
            word-break: break-word;
        }

        .rail-contact a {
            color: #24364d;
        }

        .resume {
            width: 100%;
            max-width: var(--max);
            margin-left: auto;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(201, 196, 183, 0.75);
            border-radius: 12px;
            box-shadow: 0 22px 60px -40px rgba(18, 20, 24, 0.65);
            overflow: hidden;
            animation: rise 0.6s ease-out;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            padding: 2.2rem 2rem 1.3rem;
            border-bottom: 1px solid var(--line);
            position: relative;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-family: 'Cardo', serif;
            letter-spacing: 0.06em;
            font-size: clamp(1.75rem, 3vw, 2.5rem);
            color: #111317;
        }

        .subtitle {
            margin: 0.4rem 0 0;
            color: var(--muted);
            font-size: 0.98rem;
            letter-spacing: 0.02em;
        }

        main {
            padding: 1.1rem 2rem 1.4rem;
        }

        section {
            padding: 1rem 0 1.1rem;
            border-bottom: 1px solid rgba(201, 196, 183, 0.64);
        }

        section:last-child {
            border-bottom: 0;
        }

        h2 {
            margin: 0 0 0.72rem;
            font-size: 0.84rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent);
        }

        p {
            margin: 0.25rem 0;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 0.28rem;
        }

        a {
            color: #26384f;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        a:hover {
            color: #111827;
        }

        .project {
            margin-bottom: 0.88rem;
        }

        .project strong {
            font-family: 'Cardo', serif;
            font-size: 1.03rem;
            font-weight: 700;
        }

        .skill-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-top: 1rem;
        }

        .skill-icons img,
        .certification-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
            vertical-align: middle;
        }

        .certification-list li {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        footer {
            padding: 1.2rem 2rem 1.8rem;
            color: var(--muted);
            font-size: 0.94rem;
        }

        @media (max-width: 980px) {
            body {
                padding: 1rem 0.75rem;
            }

            .page-layout {
                display: block;
                padding-left: 0;
            }

            .photo-rail {
                position: static;
                justify-items: start;
                margin: 0 0 0.95rem;
                padding-top: 0;
            }

            .avatar-shell {
                width: 124px;
                height: 124px;
            }

            .rail-contact {
                width: min(100%, 360px);
            }

            .resume {
                max-width: 100%;
            }

            header,
            main,
            footer {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            h2 {
                letter-spacing: 0.11em;
            }
        }
    </style>
</head>
<body>
    <div class="page-layout">
        <aside class="photo-rail" aria-label="Profile photo">
            <div class="avatar-shell">
                <img id="profile-image" src="images/profile.jpg" alt="Ronson Danthy" />
            </div>
            <section class="rail-contact" id="rail-contact" hidden>
                <h3>Contact</h3>
                <div id="rail-contact-content"></div>
            </section>
        </aside>

        <article class="resume">
            <header>
                <h1 id="name">Loading...</h1>
                <p class="subtitle" id="tagline">Loading profile...</p>
            </header>

            <main id="sections"></main>
            <footer id="footer"></footer>
        </article>
    </div>

    <script>
        const INLINE_MARKDOWN = /!\[(.*?)\]\((.+?)\)|\*\*\*(.+?)\*\*\*|\*\*(.+?)\*\*|\*(.+?)\*|\[(.+?)\]\((.+?)\)/g;

        const SKILL_LOGOS = [
            ["Java", "https://upload.wikimedia.org/wikipedia/en/3/30/Java_programming_language_logo.svg"],
            ["Python", "https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg"],
            ["Node.js", "https://upload.wikimedia.org/wikipedia/commons/d/d9/Node.js_logo.svg"],
            ["Vue.js", "https://upload.wikimedia.org/wikipedia/commons/9/95/Vue.js_Logo_2.svg"],
            ["Docker", "https://upload.wikimedia.org/wikipedia/commons/4/4e/Docker_%28container_engine%29_logo.svg"],
            ["TensorFlow", "https://upload.wikimedia.org/wikipedia/commons/2/2d/Tensorflow_logo.svg"],
            ["Git", "https://upload.wikimedia.org/wikipedia/commons/3/3f/Git_icon.svg"]
        ];

        const CERTIFICATION_LOGOS = [
            ["Google", "https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"],
            ["University of Michigan", "https://upload.wikimedia.org/wikipedia/commons/f/fb/Michigan_Wolverines_logo.svg"],
            ["DeepLearning.AI", "images/deeplearningai_logo.jpeg"],
            ["Google", "https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"],
            ["IBM", "https://upload.wikimedia.org/wikipedia/commons/5/51/IBM_logo.svg"],
            ["University of Michigan", "https://upload.wikimedia.org/wikipedia/commons/f/fb/Michigan_Wolverines_logo.svg"]
        ];

        function normalizeHeading(value) {
            return value.trim().toLowerCase();
        }

        function renderInlineMarkdown(text) {
            const escaped = text
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");

            return escaped.replace(INLINE_MARKDOWN, (_, imageAlt, imageSrc, strongEmText, strongText, emText, linkLabel, linkHref) => {
                if (imageSrc) {
                    const safeSrc = imageSrc.replaceAll('"', '&quot;');
                    const safeAlt = (imageAlt || "").replaceAll('"', '&quot;');
                    return `<img src="${safeSrc}" alt="${safeAlt}" width="30" height="30" style="vertical-align: middle; margin-right: 14px; margin-top: 10px;" />`;
                }

                if (strongEmText) {
                    return `<strong><em>${strongEmText}</em></strong>`;
                }

                if (strongText) {
                    return `<strong>${strongText}</strong>`;
                }

                if (emText) {
                    return `<em>${emText}</em>`;
                }

                if (linkLabel && linkHref) {
                    const safeHref = linkHref.replaceAll('"', "&quot;");
                    return `<a href="${safeHref}" target="_blank" rel="noopener noreferrer">${linkLabel}</a>`;
                }

                return _;
            });
        }

        function parseReadme(markdown) {
            const lines = markdown.split(/\r?\n/);
            const data = {
                name: "",
                subtitle: "",
                profilePhoto: "",
                profilePhotoAlt: "Profile photo",
                sections: {},
                sectionOrder: [],
                declaration: [],
                copyright: ""
            };

            let currentSection = "";

            for (const rawLine of lines) {
                const line = rawLine.trim();

                if (!line) {
                    if (currentSection) {
                        data.sections[currentSection].push("");
                    }
                    continue;
                }

                if (line.startsWith("# ")) {
                    data.name = line.slice(2).trim();
                    continue;
                }

                if (line.startsWith("## ")) {
                    currentSection = normalizeHeading(line.slice(3));
                    data.sections[currentSection] = data.sections[currentSection] || [];
                    data.sectionOrder.push(currentSection);
                    continue;
                }

                if (!currentSection) {
                    const imageMatch = line.match(/^!\[(.*?)\]\((.+?)(?:\s+".*?")?\)$/);
                    if (imageMatch) {
                        data.profilePhotoAlt = imageMatch[1] || "Profile photo";
                        data.profilePhoto = imageMatch[2].trim() || "";
                        continue;
                    }
                }

                if (!currentSection && !data.subtitle) {
                    data.subtitle = line;
                    continue;
                }

                if (currentSection) {
                    data.sections[currentSection].push(line);
                }
            }

            const declarationContent = data.sections.declaration || [];
            const footerLines = declarationContent.filter((line) => line);
            if (footerLines.length) {
                const maybeCopyright = footerLines[footerLines.length - 1];
                if (maybeCopyright.startsWith("©")) {
                    data.copyright = maybeCopyright;
                    data.declaration = footerLines.slice(0, -1);
                } else {
                    data.declaration = footerLines;
                }
            }

            return data;
        }

        function asHtmlBlocks(lines) {
            const nonEmpty = lines.filter((line) => line !== "");
            if (!nonEmpty.length) {
                return "<p>Update this section in README.md.</p>";
            }

            const allBullets = nonEmpty.every((line) => /^[-*]\s+/.test(line));
            if (allBullets) {
                const items = nonEmpty
                    .map((line) => line.replace(/^[-*]\s+/, ""))
                    .map((line) => `<li>${renderInlineMarkdown(line)}</li>`)
                    .join("");
                return `<ul>${items}</ul>`;
            }

            let html = "";
            for (const line of lines) {
                if (!line) {
                    continue;
                }

                if (line.startsWith("### ")) {
                    html += `<p><strong>${renderInlineMarkdown(line.slice(4))}</strong></p>`;
                    continue;
                }

                if (/^[-*]\s+/.test(line)) {
                    html += `<p>${renderInlineMarkdown(line.replace(/^[-*]\s+/, ""))}</p>`;
                    continue;
                }

                html += `<p>${renderInlineMarkdown(line)}</p>`;
            }

            return html;
        }

        function renderSkillLogos() {
            return `<div class="skill-icons" aria-label="Technology logos">${SKILL_LOGOS
                .map(([alt, src]) => `<img src="${src}" alt="${alt}" title="${alt}" />`)
                .join("")}</div>`;
        }

        function renderCertifications(lines) {
            const items = lines
                .filter((line) => /^[-*]\s+/.test(line))
                .map((line, index) => {
                    const text = line.replace(/^[-*]\s+/, "");
                    const logo = CERTIFICATION_LOGOS[index];
                    return `<li><img class="certification-icon" src="${logo[1]}" alt="${logo[0]}" title="${logo[0]}" /><span>${renderInlineMarkdown(text)}</span></li>`;
                })
                .join("");
            return `<ul class="certification-list">${items}</ul>`;
        }

        function loadImageCandidate(src) {
            return new Promise((resolve) => {
                const probe = new Image();
                probe.onload = () => resolve(src);
                probe.onerror = () => resolve("");
                probe.src = src;
            });
        }

        async function setProfileImage(data) {
            const image = document.getElementById("profile-image");
            const requested = data.profilePhoto || "images/profile.jpg";
            const normalized = requested.replace(/^<|>$/g, "").trim();
            const cleaned = normalized
                .replace(/^['"]|['"]$/g, "")
                .replace(/[?#].*$/, "");
            const fileName = cleaned.split("/").pop() || "profile.jpg";
            const decoded = (() => {
                try {
                    return decodeURIComponent(cleaned);
                } catch {
                    return cleaned;
                }
            })();

            const variants = [
                normalized,
                cleaned,
                cleaned.replace(/^\.\//, ""),
                cleaned.startsWith("./") ? cleaned : `./${cleaned}`,
                `images/${fileName}`,
                `./images/${fileName}`,
                "images/profile.jpg",
                "./images/profile.jpg",
                decoded,
                encodeURI(decoded)
            ];

            const uniqueCandidates = [...new Set(variants.filter(Boolean))];
            image.alt = data.profilePhotoAlt || "Profile photo";
            image.style.display = "none";

            let resolvedSrc = "";
            for (const candidate of uniqueCandidates) {
                resolvedSrc = await loadImageCandidate(candidate);
                if (resolvedSrc) {
                    break;
                }
            }

            if (!resolvedSrc) {
                return;
            }

            image.src = resolvedSrc;
            image.style.display = "block";
        }

        function updatePhotoScrollEffect() {
            const image = document.getElementById("profile-image");
            if (!image || image.style.display === "none") {
                return;
            }

            const doc = document.documentElement;
            const maxScroll = Math.max(1, doc.scrollHeight - window.innerHeight);
            const progress = Math.min(1, Math.max(0, window.scrollY / maxScroll));
            const grayscale = 100 - progress * 100;
            const saturation = 85 + progress * 30;
            const scale = 1 + progress * 0.03;

            image.style.filter = `grayscale(${grayscale.toFixed(1)}%) saturate(${saturation.toFixed(1)}%)`;
            image.style.transform = `scale(${scale.toFixed(3)})`;
        }

        function renderPage(data) {
            document.getElementById("name").textContent = data.name || "Your Name";
            document.getElementById("tagline").textContent = data.subtitle || "Add your tagline below the H1 heading in README.md";
            setProfileImage(data);

            const container = document.getElementById("sections");
            container.innerHTML = "";

            const contactSectionKeys = ["contact information", "contact"];
            const contactKey = contactSectionKeys.find((key) => data.sections[key] && data.sections[key].length);
            const railContact = document.getElementById("rail-contact");
            const railContactContent = document.getElementById("rail-contact-content");

            if (contactKey) {
                railContactContent.innerHTML = asHtmlBlocks(data.sections[contactKey]);
                railContact.hidden = false;
            } else {
                railContactContent.innerHTML = "";
                railContact.hidden = true;
            }

            const orderedSections = data.sectionOrder.filter((key) => key !== "declaration" && key !== contactKey);

            for (const sectionKey of orderedSections) {
                const lines = data.sections[sectionKey] || [];
                const section = document.createElement("section");
                const heading = document.createElement("h2");
                heading.textContent = sectionKey.replace(/\b\w/g, (char) => char.toUpperCase());
                section.appendChild(heading);
                if (sectionKey === "certifications") {
                    section.innerHTML += renderCertifications(lines);
                } else {
                    section.innerHTML += asHtmlBlocks(lines);
                }
                if (sectionKey === "skills") {
                    section.innerHTML += renderSkillLogos();
                }
                container.appendChild(section);
            }

            const footer = document.getElementById("footer");
            const declarationText = data.declaration.length
                ? data.declaration.join(" ")
                : "Add ## Declaration in README.md for footer text.";

            footer.innerHTML = `<p><strong>Declaration:</strong> ${renderInlineMarkdown(declarationText)}</p><p>${renderInlineMarkdown(data.copyright || "© 2026")}</p>`;
        }

        async function init() {
            try {
                const response = await fetch("README.md", { cache: "no-cache" });
                if (!response.ok) {
                    throw new Error("Could not read README.md");
                }

                const markdown = await response.text();
                const parsed = parseReadme(markdown);
                renderPage(parsed);
                updatePhotoScrollEffect();
            } catch (error) {
                document.getElementById("sections").innerHTML = "<section><h2>Error</h2><p>Unable to load README.md. Make sure this file exists at the project root.</p></section>";
            }
        }

        window.addEventListener("scroll", updatePhotoScrollEffect, { passive: true });
        window.addEventListener("resize", updatePhotoScrollEffect);

        init();
    </script>

</body>
</html>
